<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Whatever</title>

    <link rel="stylesheet" href="LS_style.css">
    <script src="LS_script.js" defer></script>
    <link rel="stylesheet" href="nav.css">
</head>
<!-- ============ TOP UTILITY BAR ============ -->
<header>
  <div class="nav-top">
    <div class="nav-left">
      <a href="#signin"><img src="profile.png" alt="" class="nav-icon">Sign In / Sign Up</a>
    </div>
    <div class="nav-right"> 
    <a href="#membership"><img src="member-removebg-preview.png" alt=""class="nav-icon">Membership</a>
    <a href="#services"><img src="promotion_events.png" alt=""class="nav-icon">Book Beauty Services</a>  
    <a href="#promotions"><img src="beautypass (1).png" alt="" class="nav-icon">Promotions &amp; Events</a>
    <a href="#wishlist" class="icon-link"><img src="wishlist (2).png" alt="" class="nav-icon">Wishlist</a>
    <a href="#cart" class="icon-link"><img src="cart (2).png" alt="" class="nav-icon">Cart</a>
    </div>
  </div>
</header>


<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-image">
            <div class="image-content">
                <h1>Whatever</h1>
                <div class="brand-line"></div>
                <p>Your beauty journey starts here.</p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-form-container">

            <div class="auth-form">

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Login to your Whatever account.
                </p>

                <form id="loginForm">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                    <!-- Password -->
                    <div class="form-group">

                        <div class="password-label">

                            <label for="loginPassword">
                                Password
                            </label>

                            <a href="#" id="forgotPassword">
                                Forgot Password?
                            </a>

                        </div>

                        <div class="password-container">

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="loginPassword"
                            >
                                
                            </button>

                        </div>

                    </div>

                    <!-- Remember Me -->
                    <div class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <label for="rememberMe">
                            Remember me
                        </label>

                    </div>

                    <!-- Message -->
                    <p id="loginMessage" class="message"></p>

                    <!-- Login Button -->
                    <button type="submit" class="auth-button">
                        Login
                    </button>

                </form>

                <!-- Register Link -->
                <p class="switch-page">
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

                <a href="main_page.html" class="back-home">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>
    

</body>
</html>
