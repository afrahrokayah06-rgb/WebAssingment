<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Whatever</title>

    <link rel="stylesheet" href="LS_style.css">
    <script src="LS_script.js" defer></script>
</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-image">
            <div class="image-content">
                <h1>Whatever</h1>
                <p>Discover beauty that makes you feel confident.</p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-form-container">

            <div class="auth-form">

                <h2>Create Your Account</h2>

                <p class="subtitle">
                    Join Whatever and discover your beauty essentials.
                </p>

                <form id="registerForm">

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName">Full Name</label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="registerEmail">Email Address</label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <!-- Phone -->
                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="registerPassword">Password</label>

                        <div class="password-container">

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="registerPassword"
                            >
                                
                            </button>

                        </div>

                        <small>
                            Password must be at least 6 characters.
                        </small>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>

                        <div class="password-container">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="confirmPassword"
                            >
                                
                            </button>

                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label for="terms">
                            I agree to the Terms & Conditions
                        </label>

                    </div>

                    <!-- Message -->
                    <p id="registerMessage" class="message"></p>

                    <!-- Register Button -->
                    <button type="submit" class="auth-button">
                        Create Account
                    </button>

                </form>

                <!-- Login Link -->
                <p class="switch-page">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
                 <a href="main_page.html" class="back-home">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</body>
</html>
