  <header class="wish-header">
    <div class="eyebrow">Whatever Beauty</div>
    <h1>Your Wishlist</h1>
    <p>All the shades you've saved, in one place.</p>
    <a href="main_page.html">Browse More</a>
  </header>

  <main class="wish-container">
    <div class="wish-grid" id="wish-grid"></div>

    <div class="wish-empty" id="wish-empty">
      <img src="wishlist.png" alt="" class="empty-icon">
      <h2>Your wishlist is empty</h2>
      <p>Tap the heart icon on any product to save it here.</p>
    </div>
  </main>

  <div id="wish-toast" class="wish-toast"></div>

 <script>
    const WISHLIST_KEY = 'whatever_wishlist';
    const CART_KEY = 'cart'; // must match the key cart.js reads — do not rename

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem(CART_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function addToCart(item) {
      const cart = getCart();

      // cart.js items have no "id" field — it matches rows by index only —
      // so we dedupe here by name + image to avoid creating duplicate rows.
      const existing = cart.find(c => c.name === item.name && c.image === item.image);

      if (existing) {
        existing.quantity = (Number(existing.quantity) || 1) + 1;
      } else {
        // cart.js does Number(product.price), so strip things like "RM " down to a plain number first
        const numericPrice = parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;

        cart.push({
          name: item.name,
          price: numericPrice,
          image: item.image,
          quantity: 1
        });
      }

      saveCart(cart);
      showToast('Added to Cart');
    }

    function getWishlist() {
      try {
        return JSON.parse(localStorage.getItem(WISHLIST_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveWishlist(list) {
      localStorage.setItem(WISHLIST_KEY, JSON.stringify(list));
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('wish-toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function removeItem(id, cardEl) {
      cardEl.classList.add('removing');
      showToast('Removed from Wishlist');

      cardEl.addEventListener('transitionend', () => {
        const updated = getWishlist().filter(item => item.id !== id);
        saveWishlist(updated);
        renderWishlist();
      }, { once: true });
    }

    function renderWishlist() {
      const list = getWishlist();
      const grid = document.getElementById('wish-grid');
      const empty = document.getElementById('wish-empty');

      grid.innerHTML = '';

      if (list.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      grid.style.display = 'grid';
      empty.style.display = 'none';

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'wish-card';
        card.innerHTML = `
          <div class="wish-img-wrap">
            <img src="${item.image}" alt="${item.name}">
          </div>
          <div class="wish-body">
            <h3>${item.name}</h3>
            <span class="wish-price">${item.price}</span>
            <div class="wish-actions">
              <button class="wish-add-bag">Add to Bag</button>
              <button class="wish-remove" data-id="${item.id}">Remove</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.querySelectorAll('.wish-add-bag').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.wish-card');
          const id = card.querySelector('.wish-remove').dataset.id;
          const item = list.find(i => i.id === id);
          if (item) addToCart(item);
        });
      });
 
      document.querySelectorAll('.wish-remove').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.wish-card');
          removeItem(btn.dataset.id, card);
        });
      });
    }

    document.addEventListener('DOMContentLoaded', renderWishlist);
  </script>


</body>
</html>
