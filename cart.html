<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | Whatever</title>
<meta name="description" content="Shop Face, Eyes, Lips, Nails and Makeup Remover. Free sample with every purchase.">
<link rel="stylesheet" href="cart.css">


</head>
<body>
 
  <header class="cart-header">
    <h1>Your Cart</h1>
    <a href="main_page.html">Back to Home</a>
  </header>

<main class="cart-page">
    <div id="cart-items"></div>
    <div class="cart-summary">
        <h2 class="cart-tax">SubTotal: RM <span id="cart-taxtotal">0.00</span></h2>
        <h2 class="cart-tax">Tax (20%): RM <span id="cart-tax">0.00</span></h2>
        <h2 class="cart-total">Total: RM <span id="cart-total">0.00</span></h2>
        <button id="checkout-btn">
            PROCEED TO CHECKOUT
        </button>
        <script>
          document.getElementById("checkout-btn").addEventListener("click", function () {
            const loggedInUser = sessionStorage.getItem("loggedInUser");
            if (!loggedInUser) { alert("Please log in before checkout.");
            window.location.href = "login.html";
            return;
          }
          
          const cart =
          JSON.parse(localStorage.getItem("cart")) || [];
          
          if (cart.length === 0) {
            alert("Your cart is empty.");
            return;
          }
          window.location.href = "payment.html";
        });
        </script>
    </div>
</main>

<div id="cart-toast" class="toast"></div>
 
<script src="main_page.js"></script>
<script src="cart.js"></script>
</body>
</html>
